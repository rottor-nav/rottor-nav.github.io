{% assign cta = site.data.landing.cta %}
<section class="cta-section">
  <div class="container">
    <div class="cta-card">
      <h2>{{ cta.title }}</h2>
      <p>{{ cta.lead }}</p>
      <a class="btn btn-primary" href="{{ site.apk_url }}" target="_blank" rel="noopener noreferrer">{{ cta.primary }}</a>
    </div>
  </div>
</section>
